name: Deploy latoc staging

# Manual only. The latoc-staging environment is restricted to `main`, so
# only merged code can reach its secrets. Runbook: docs/staging-latoc.md.
on:
  workflow_dispatch:
    inputs:
      test_campaign:
        description: >-
          Test drive: "create" makes a TEST Bible Marathon starting today and
          emails the invite link to the site admin address (run again for a
          new link); "remove" deletes all test data and test-only accounts.
        type: choice
        options:
          - none
          - create
          - remove
        default: none

permissions:
  contents: read

concurrency:
  group: deploy-latoc
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to latoc.vayhub.org
    runs-on: ubuntu-latest
    environment:
      name: latoc-staging
      url: https://latoc.vayhub.org/
    env:
      SITE_URL: https://latoc.vayhub.org
    steps:
      - uses: actions/checkout@v7

      - name: Build the plugin bundle
        run: |
          WP_VERSION="$(jq -r '.core' .wp-env.json | sed 's/.*#//')"
          [ -n "$WP_VERSION" ] || { echo "No pinned WordPress version"; exit 1; }
          echo "WP_VERSION=$WP_VERSION" >> "$GITHUB_ENV"
          tar -czf "$RUNNER_TEMP/jlife-plugins.tgz" -C plugins \
            --exclude=vendor --exclude=tests --exclude='composer.*' \
            --exclude='phpunit.xml*' --exclude='.phpunit.result.cache' \
            jlife-studies jlife-huddles jlife-challenges jlife-auth jlife-scripture \
            -C "$GITHUB_WORKSPACE/content" reading-plans/2026-12-20_life-and-teachings-of-jesus_primary.json \
            reading-plans/2026-12-20_harmony-parallel_supplemental.json \
            -C "$GITHUB_WORKSPACE/bin/deploy" latoc-landing.php latoc-landing-content.php
          tar -tzf "$RUNNER_TEMP/jlife-plugins.tgz" | head -50

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LATOC_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LATOC_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.LATOC_SSH_HOST }}
          SSH_USER: ${{ secrets.LATOC_SSH_USER }}
          SSH_PORT: ${{ secrets.LATOC_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/latoc
          chmod 600 ~/.ssh/latoc
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host latoc
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile ~/.ssh/latoc
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 30
          EOF
          ssh latoc 'echo "SSH OK"; mkdir -p ~/.latoc && chmod 700 ~/.latoc'

      - name: Upload bundle, script and settings
        env:
          WP_PATH: ${{ secrets.LATOC_WP_PATH }}
          DB_NAME: ${{ secrets.LATOC_DB_NAME }}
          DB_USER: ${{ secrets.LATOC_DB_USER }}
          DB_PASSWORD: ${{ secrets.LATOC_DB_PASSWORD }}
          TEST_CAMPAIGN: ${{ inputs.test_campaign }}
        run: |
          scp -q "$RUNNER_TEMP/jlife-plugins.tgz" latoc:.latoc/jlife-plugins.tgz
          scp -q bin/deploy/latoc-remote.sh latoc:.latoc/latoc-remote.sh
          # Settings travel over stdin into a 0600 file the script deletes,
          # so the database password never appears on a command line.
          {
            printf 'WP_PATH=%q\n' "$WP_PATH"
            printf 'SITE_URL=%q\n' "$SITE_URL"
            printf 'WP_VERSION=%q\n' "$WP_VERSION"
            printf 'DB_NAME=%q\n' "$DB_NAME"
            printf 'DB_USER=%q\n' "$DB_USER"
            printf 'DB_PASSWORD=%q\n' "$DB_PASSWORD"
            printf 'TEST_CAMPAIGN=%q\n' "$TEST_CAMPAIGN"
          } | ssh latoc 'umask 077; cat > ~/.latoc/deploy.env'

      - name: Install or update on the server
        run: ssh latoc 'bash ~/.latoc/latoc-remote.sh'

      - name: Smoke test over HTTPS
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -L "$SITE_URL/")"
          echo "Front page: HTTP $code"
          [ "$code" = "200" ]
          # Magic links (jlife-bridge) must stay off until #37/#38 (#57).
          if curl -sS -L "$SITE_URL/?jlife_token=deploy-probe" | grep -q "Please ask your huddle leader for a new one"; then
            echo "::error::The magic-link route answered; jlife-bridge must be inactive."
            exit 1
          fi
          echo "Magic-link route: off"

          # Public landing pages (#110). They are seeded as DRAFTS and the owner
          # publishes them in wp-admin, so what to expect depends on their state.
          # The server script writes that state (statuses and slugs, no secrets).
          state="$(ssh latoc 'cat ~/.latoc/landing-state' 2>/dev/null || true)"
          val() { printf '%s\n' "$state" | sed -n "s/^$1=//p" | head -n 1; }
          en_status="$(val en_status)"; vi_status="$(val vi_status)"
          en_slug="$(val en_slug)"; vi_slug="$(val vi_slug)"; front="$(val front)"
          echo "Landing pages: EN ${en_status:-unknown}, VI ${vi_status:-unknown}, front page ${front:-unknown}"

          # /vi/ must never fail or loop (curl stops after 5 redirects and errors).
          vi_code="$(curl -sS -o "$RUNNER_TEMP/vi.html" -w '%{http_code}' --max-redirs 5 -L "$SITE_URL/vi/")"
          echo "/vi/: HTTP $vi_code"
          case "$vi_code" in 200|404) ;; *) echo "::error::/vi/ answered HTTP $vi_code"; exit 1 ;; esac

          # A draft must not be public, by its slug or through the language URL.
          if [ "$en_status" = "draft" ] && [ -n "$en_slug" ]; then
            c="$(curl -sS -o /dev/null -w '%{http_code}' -L "$SITE_URL/$en_slug/")"
            echo "Draft EN page /$en_slug/: HTTP $c (expect 404)"
            [ "$c" = "404" ]
          fi
          if [ "$vi_status" = "draft" ] && [ -n "$vi_slug" ]; then
            c="$(curl -sS -o /dev/null -w '%{http_code}' -L "$SITE_URL/vi/$vi_slug/")"
            echo "Draft VI page /vi/$vi_slug/: HTTP $c (expect 404)"
            [ "$c" = "404" ]
          fi

          # Both published and the EN page is the front page: check the pair.
          if [ "$en_status" = "publish" ] && [ "$vi_status" = "publish" ] && [ "$front" = "en-landing" ]; then
            curl -sS -L -o "$RUNNER_TEMP/en.html" "$SITE_URL/"
            [ "$vi_code" = "200" ] || { echo "::error::/vi/ should serve the Vietnamese page"; exit 1; }
            grep -Eq '<html[^>]* lang="vi' "$RUNNER_TEMP/vi.html" || { echo "::error::/vi/ is not lang=vi"; exit 1; }
            grep -Eq '<html[^>]* lang="en' "$RUNNER_TEMP/en.html" || { echo "::error::/ is not lang=en"; exit 1; }
            grep -Eq 'hreflang="vi"' "$RUNNER_TEMP/en.html" || { echo "::error::/ has no hreflang=vi alternate"; exit 1; }
            echo "Landing pair: / is English, /vi/ is Vietnamese, hreflang present"
          fi

      - name: Remove SSH material
        if: always()
        run: rm -rf ~/.ssh
