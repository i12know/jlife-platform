name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    name: Content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Validators are dependency-free; no npm install needed.
      - name: Validate harmony dataset (JSON invariants + CSV sync)
        run: node bin/validate-harmony.js
      - name: Validate series/lesson content against /content/schemas
        run: node bin/validate-content.js
      - name: Validate reading plans (CSV sync, calendar, section IDs, references, links)
        run: node bin/validate-reading-plans.js
      - name: Unit tests for reading-plan parsing and Bible links
        run: node --test bin/test/*.test.js
      # No app JS/CSS yet — bin/ holds Node tooling, so a syntax check is the
      # applicable lint. Swap in eslint/stylelint when plugin JS/CSS lands.
      - name: Syntax-check Node tooling
        run: |
          for f in bin/*.js bin/content-lib/*.js bin/test/*.js; do node --check "$f"; done

  php-lint:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install tooling
        run: composer install --no-interaction --no-progress
      - name: PHPCS (WordPress coding standards)
        run: vendor/bin/phpcs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  phpunit:
    # Runs every plugin test suite inside wp-env's tests container. The S5
    # (#12) access-control tests land in plugins/jlife-huddles/tests/ and
    # become required checks here automatically.
    name: PHPUnit (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install npm dependencies
        run: npm ci
      - name: Install plugin test dependencies
        run: composer install --no-interaction --no-progress
        working-directory: plugins/jlife-huddles
      - name: Install jlife-studies test dependencies
        run: composer install --no-interaction --no-progress
        working-directory: plugins/jlife-studies
      - name: Install jlife-challenges test dependencies
        run: composer install --no-interaction --no-progress
        working-directory: plugins/jlife-challenges
      - name: Start wp-env
        run: npx wp-env start
      # wp-env only downloads the WP PHPUnit suite during its configure
      # phase; this guarantees the suite + wp-tests-config.php exist even
      # when that phase was skipped (cached/interrupted instances).
      - name: Ensure WordPress PHPUnit test library
        run: node bin/ensure-wp-tests.js
      - name: Run jlife-huddles test suite
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/jlife-huddles vendor/bin/phpunit
      - name: Run jlife-studies test suite
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/jlife-studies vendor/bin/phpunit
      - name: Run jlife-challenges test suite
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/jlife-challenges vendor/bin/phpunit

  dependency-audit:
    # Advisory checks (#57). Non-blocking for now: findings show as warnings
    # on the run; Dependabot raises the fix PRs. Make blocking once clean.
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: npm audit
        run: npm audit --audit-level=high || echo "::warning::npm audit reported vulnerabilities"
      - name: composer audit (root tooling)
        run: composer audit --locked || echo "::warning::composer audit reported vulnerabilities"
      - name: composer audit (plugin test dependencies)
        run: |
          for p in plugins/jlife-huddles plugins/jlife-studies plugins/jlife-challenges; do
            (cd "$p" && composer install --no-interaction --no-progress --quiet && composer audit) \
              || echo "::warning::composer audit reported vulnerabilities in $p"
          done

